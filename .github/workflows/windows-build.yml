name: Windows build

on:
  push:
    branches: [desktop-gui-v2, star-wars-ui]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Build Visual Studio solution
        shell: pwsh
        run: msbuild GoHClone.sln /m /p:Configuration=Debug /p:Platform=x64 /p:BuildProjectReferences=true /verbosity:minimal
      - name: Upload desktop application
        uses: actions/upload-artifact@v4
        with:
          name: GoHClone-Desktop-x64
          path: build/Desktop/x64/Debug/
          if-no-files-found: error
          retention-days: 14
